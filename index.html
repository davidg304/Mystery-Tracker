<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#292b30"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mystery Tracker"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><title>Mystery Tracker</title></head>
<body><header><h1>Mystery Tracker</h1><p class="sub">Tap a discovered clue to mark it. Tap again to undo.</p><div class="toolbar"><button id="fit" type="button" aria-pressed="false">Fit whole board</button><button id="reset" type="button">↺ Reset all marks</button></div><p id="count" role="status" aria-live="polite">Loading…</p></header><nav aria-label="Jump to section" class="sections"><button data-section="Locations">Locations</button><button data-section="Symbols">Symbols</button><button data-section="Objects">Objects</button></nav><p class="hint" id="hint">Swipe sideways to see all clues. The board stays large enough to tap.</p><main id="viewport" class="viewport" tabindex="0" aria-label="Scrollable mystery board"><div class="board" id="board"><img src="./board.jpg" alt="Mystery clue board with locations, symbols and objects" width="1536" height="1090" draggable="false"></div></main><footer>Selections are saved on this device. No account required.</footer><script type="module" src="./app.js"></script></body></html>
